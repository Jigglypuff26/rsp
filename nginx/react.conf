# Глобальная конфигурация Nginx для RSP проекта
# Разместить в /etc/nginx/sites-available/react.conf и создать симлинк в /etc/nginx/sites-enabled/

# Upstream для контейнера
upstream rsp_backend {
    server 127.0.0.1:3030 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# HTTP сервер (редирект на HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name pp-maksim.ru www.pp-maksim.ru;

    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pp-maksim.ru www.pp-maksim.ru;

    # SSL сертификаты Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/pp-maksim.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pp-maksim.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/pp-maksim.ru/chain.pem;

    # Логирование
    access_log /var/log/nginx/rsp-access.log;
    error_log /var/log/nginx/rsp-error.log warn;

    # Максимальный размер загружаемых файлов
    client_max_body_size 10M;

    # Таймауты
    keepalive_timeout 65;
    send_timeout 60;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Отключение версии nginx в заголовках
    server_tokens off;

    # Rate limiting и ограничение соединений (зоны объявлены в /etc/nginx/nginx.conf)
    limit_req zone=global_req_limit burst=40 nodelay;
    limit_conn global_conn_limit 20;
    limit_conn server_conn_limit 200;

    # Блокировка ботов и подозрительных запросов (карты объявлены в /etc/nginx/nginx.conf)
    if ($bad_bot) {
        return 403;
    }
    if ($bad_request) {
        return 403;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    include /etc/nginx/snippets/gzip.conf;

    # Проксирование на контейнер
    location / {
        proxy_pass http://rsp_backend;
        proxy_http_version 1.1;
        
        # Таймауты для предотвращения 502 ошибок
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Заголовки для проксирования
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Обработка ошибок
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Буферизация
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Отключение буферизации для streaming
        proxy_request_buffering off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://rsp_backend/health;
        access_log off;
    }

    # Статические файлы можно кэшировать на уровне nginx
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://rsp_backend;
        include /etc/nginx/snippets/static-cache.conf;
    }

    # Блокировка доступа к скрытым файлам
    include /etc/nginx/snippets/hidden-files.conf;

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
